<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glowing Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="1" opacity="0.4" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes wave {
      0% { transform: translateY(0px) scaleY(1); }
      50% { transform: translateY(-8px) scaleY(1.05); }
      100% { transform: translateY(0px) scaleY(1); }
    }
    @keyframes pulse-slow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }
    @keyframes float-item {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    .bg-grid { fill: url(#grid); }
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: url(#text-grad); }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #9ca3af; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #f3f4f6; }
    .animated-bar { animation: wave 4s ease-in-out infinite; }
    .glow-circle { animation: pulse-slow 6s ease-in-out infinite; }
    .floating-card { animation: float-item 5s ease-in-out infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="350" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="350" class="bg-grid" rx="16" />

  <!-- Background Dynamic Glowing Circles -->
  <circle cx="150" cy="80" r="120" fill="#7c3aed" class="glow-circle" opacity="0.25" filter="url(#glow)" />
  <circle cx="1050" cy="260" r="140" fill="#06b6d4" class="glow-circle" opacity="0.2" filter="url(#glow)" />

  <!-- Background Dynamic Cost Chart Visuals (Right Side Background) -->
  <g opacity="0.35" transform="translate(720, 80)">
    <!-- Chart Bars with animation -->
    <rect x="0" y="120" width="36" height="100" rx="6" fill="#3b82f6" class="animated-bar" style="animation-delay: 0s;" />
    <rect x="50" y="80" width="36" height="140" rx="6" fill="#8b5cf6" class="animated-bar" style="animation-delay: 0.4s;" />
    <rect x="100" y="140" width="36" height="80" rx="6" fill="#06b6d4" class="animated-bar" style="animation-delay: 0.8s;" />
    <rect x="150" y="50" width="36" height="170" rx="6" fill="#10b981" class="animated-bar" style="animation-delay: 1.2s;" />
    <rect x="200" y="90" width="36" height="130" rx="6" fill="#f59e0b" class="animated-bar" style="animation-delay: 1.6s;" />
    <rect x="250" y="30" width="36" height="190" rx="6" fill="#ec4899" class="animated-bar" style="animation-delay: 2.0s;" />
    
    <!-- Trend Line -->
    <path d="M 18 120 Q 68 60, 118 130 T 218 80 T 268 30" fill="none" stroke="#60a5fa" stroke-width="4" stroke-dasharray="6 6" />
  </g>

  <!-- Top Accent Border Bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent-grad)" rx="3" />

  <!-- Foreground Content Container -->
  <!-- Header Badges -->
  <g transform="translate(80, 55)">
    <rect x="0" y="0" width="140" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
    <text x="70" y="21" text-anchor="middle" class="badge-text" fill="#a5b4fc">💰 FinOps 2.0</text>

    <rect x="152" y="0" width="180" height="32" rx="16" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
    <text x="242" y="21" text-anchor="middle" class="badge-text" fill="#6ee7b7">⚡ Shift-Left Cost IaC</text>

    <rect x="344" y="0" width="150" height="32" rx="16" fill="#4c1d95" stroke="#a855f7" stroke-width="1.5" />
    <text x="419" y="21" text-anchor="middle" class="badge-text" fill="#e9d5ff">📊 Multi-Cloud</text>
  </g>

  <!-- Main Title & Subtitle (Crisp & High Contrast Foreground) -->
  <g transform="translate(80, 145)">
    <text x="0" y="0" class="title">Awesome Cloud Cost Estimation 💰 📊</text>
    <text x="0" y="42" class="subtitle">Curated Directory of FinOps Platforms, Open-Source IaC Calculators &amp; Cloud Pricing Engines</text>
  </g>

  <!-- Feature Highlights / Pill Tags (Bottom Left) -->
  <g transform="translate(80, 255)">
    <!-- AWS / Azure / GCP / K8s Pills -->
    <rect x="0" y="0" width="130" height="36" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1" />
    <text x="65" y="23" text-anchor="middle" class="badge-text" fill="#d1d5db">☁️ AWS / GCP / Azure</text>

    <rect x="142" y="0" width="150" height="36" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1" />
    <text x="217" y="23" text-anchor="middle" class="badge-text" fill="#d1d5db">🏗️ Terraform &amp; IaC</text>

    <rect x="304" y="0" width="150" height="36" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1" />
    <text x="379" y="23" text-anchor="middle" class="badge-text" fill="#d1d5db">☸️ K8s Cost Modeling</text>

    <rect x="466" y="0" width="160" height="36" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1" />
    <text x="546" y="23" text-anchor="middle" class="badge-text" fill="#d1d5db">🤖 AI &amp; LLM Token Cost</text>
  </g>
</svg>
